<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MMS - Tools & Downloads</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icon Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Theme Script (Runs immediately to prevent flash) -->
    <script>
        const savedTheme = localStorage.getItem('theme') || 'system';
        if (savedTheme === 'system') {
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } else {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>
    
    <!-- ONLY relies on download.css now -->
    <link rel="stylesheet" href="assets/download.css">
</head>
<body>

    <!-- Dynamic Backgrounds -->
    <div class="dynamic-bg"></div>
    <div class="bg-overlay"></div>
    
    <!-- Top Left Logo Image -->
    <div class="top-left-logo">
        <img src="../assets/images/mmslogo.PNG" alt="MMS Logo" >
    </div>

    <!-- Theme Switcher -->
    <div class="theme-switcher">
        <button class="theme-btn" id="theme-btn" aria-label="Toggle Theme" onclick="toggleThemeMenu()">
            <i class="ph ph-moon"></i>
        </button>
        <div class="theme-dropdown" id="theme-dropdown">
            <button class="theme-option" onclick="setTheme('light')"><i class="ph ph-sun"></i> Light</button>
            <button class="theme-option" onclick="setTheme('dark')"><i class="ph ph-moon"></i> Dark</button>
            <button class="theme-option" onclick="setTheme('system')"><i class="ph ph-desktop"></i> System</button>
        </div>
    </div>

    <!-- Floating Navigation Bar -->
    <nav class="floating-nav">
        <a href="../index.html" class="nav-item" title="Home">
            <i class="ph ph-house"></i>
        </a>
        <a href="javascript:void(0)" class="nav-item active" title="Tools">
            <i class="ph ph-wrench"></i>
        </a>
    </nav>

    <!-- FULL WIDTH MAIN CONTAINER -->
    <div class="app-container">
        <div class="layout-wrapper">
            
            <div class="content-header">
                <h2>Software & Tools</h2>
                <p>Download and activate essential software, built and curated by MMS.</p>
            </div>

            <!-- STORE GRID -->
            <div class="store-grid">
                
                <!-- App Card 1: Office 365 -->
                <div class="link-card app-card highlight">
                    <div class="app-card-header">
                        <div class="app-icon-box">
                            <img src="assets/images/365-active.png" alt="Office 365">
                        </div>
                        <div class="app-info">
                            <span class="app-title">Activate Office 365</span>
                            <span class="app-meta"><i class="fa-solid fa-file-zipper"></i> activator365.rar</span>
                            <span class="app-meta"><i class="fa-solid fa-download"></i> 1.06KB</span>
                        </div>
                    </div>
                    <a href="files/activator365.rar" class="btn primary app-download-btn">
                        <i class="fa-solid fa-cloud-arrow-down"></i> Download
                    </a>
                </div>

                <!-- App Card 2: MAS -->
                <div class="link-card app-card highlight">
                    <div class="app-card-header">
                        <div class="app-icon-box pad-img">
                            <img src="assets/images/maslogo.png" alt="MAS">
                        </div>
                        <div class="app-info">
                            <span class="app-title">Activate Office & Windows</span>
                            <span class="app-meta"><i class="fa-solid fa-file-zipper"></i> MAS-3.7.zip</span>
                            <span class="app-meta"><i class="fa-solid fa-circle-info"></i> Version 3.7 | 477KB</span>
                        </div>
                    </div>
                    <a href="files/Microsoft-Activation-Scripts-3.7.zip" class="btn primary app-download-btn">
                        <i class="fa-solid fa-cloud-arrow-down"></i> Download
                    </a>
                </div>

                <!-- App Card 3: Magic Text -->
                <div class="link-card app-card">
                    <div class="app-card-header">
                        <div class="app-icon-box">
                            <img src="assets/images/icon1.png" alt="Magic Text">
                        </div>
                        <div class="app-info">
                            <span class="app-title">Text Scanner</span>
                            <span class="app-meta"><i class="fa-brands fa-windows"></i> Windows | 105MB</span>
                            <span class="app-meta app-meta-highlight"><i class="fa-solid fa-code"></i> Made By MMS</span>
                        </div>
                    </div>
                    <a href="https://mmssb.github.io/magictext.com" target="_blank" class="btn primary app-download-btn">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Visit Page
                    </a>
                </div>

            </div> <!-- End Store Grid -->
            
        </div>
    </div>
    
    <!-- Simple inline script for the theme switcher dropdown -->
    <script>
        function toggleThemeMenu() {
            document.getElementById('theme-dropdown').classList.toggle('active');
        }

        function setTheme(theme) {
            localStorage.setItem('theme', theme);
            if (theme === 'system') {
                const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            document.getElementById('theme-dropdown').classList.remove('active');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const switcher = document.querySelector('.theme-switcher');
            if (!switcher.contains(event.target)) {
                document.getElementById('theme-dropdown').classList.remove('active');
            }
        });
    </script>
</body>
</html>
